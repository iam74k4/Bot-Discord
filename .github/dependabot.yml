version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'build'
    labels:
      - 'dependencies'
    groups:
      # vitest and its coverage provider pin each other's exact version, so
      # separate PRs can never be installed one at a time.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
    ignore:
      # TypeScript 7 (the native compiler) cannot be installed next to
      # typescript-eslint yet: its peer range stops before 7, so npm ci fails
      # (#172). Remove this once typescript-eslint accepts typescript 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'ci'
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      # Every github/codeql-action step in a workflow must run the same
      # version; one PR per step fails CodeQL on each of them.
      codeql-action:
        patterns:
          - 'github/codeql-action*'
