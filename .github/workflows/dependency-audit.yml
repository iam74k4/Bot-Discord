name: Dependency Audit

on:
  schedule:
    - cron: '0 20 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-tree-audit:
    name: Full-tree npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full-tree audit
        id: audit
        continue-on-error: true
        run: npm audit --json > npm-audit-full.json

      - name: Upload audit artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: npm-audit-full
          path: npm-audit-full.json
          if-no-files-found: error

      - name: Warn on audit findings
        if: steps.audit.outcome == 'failure'
        run: |
          echo "npm audit reported dependency advisories."
          echo "Review the uploaded npm-audit-full artifact and remediate or document exceptions."
