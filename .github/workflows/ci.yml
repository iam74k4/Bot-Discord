name: CI

on:
  # Every pull request, whatever its base: stacked PRs (a feature branch
  # targeting another feature branch) would otherwise get no CI at all.
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist
          key: ${{ runner.os }}-build-${{ hashFiles('package-lock.json', 'tsconfig.json', 'src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run tests with coverage thresholds
        run: npm run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

  docker-image:
    name: Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the production image
        run: docker build -t bot-discord:ci .

      # Railway deploys this image. Native modules are the part a Node or
      # base-image change breaks without failing the build (better-sqlite3 13
      # segfaults on Node 22.12), so load each one on the real runtime.
      - name: Smoke-test the runtime
        run: |
          expected="v$(cat .nvmrc)"
          actual="$(docker run --rm bot-discord:ci node --version)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::The image runs Node $actual but .nvmrc says $expected; update the Dockerfile's NODE_IMAGE."
            exit 1
          fi
          docker run --rm bot-discord:ci node -e "
            const Database = require('better-sqlite3');
            new Database(':memory:').prepare('select 1').get();
            require('sodium-native');
            require('@snazzah/davey');
            require('opusscript');
            console.log('native modules load on', process.version);
          "
